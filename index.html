<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>nen · creative toolkit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="kicker">nen · internal</div>
  <div class="title">creative toolkit</div>

  <div class="tabs">
    <button class="tab active" data-v="img" onclick="tab('img')">image search</button>
    <button class="tab" data-v="vids" onclick="tab('vids')">nen videos</button>
    <button class="tab" data-v="refs" onclick="tab('refs')">references</button>
  </div>

  <!-- ===== IMAGE SEARCH ===== -->
  <div id="view-img" class="view">
    <div class="ver">search every nen frame — paste a script line, or describe what you want to see on screen</div>
    <div class="srow">
      <input id="iq" placeholder="founder on a laptop · $25M raised · city skyline · dashboard with charts · logo wall...">
      <button class="build sbtn" onclick="isearch()">search →</button>
    </div>
    <div class="det" id="idet"></div>
    <div id="igrid" class="igrid"></div>
    <div id="imore" class="imore"></div>
  </div>

  <!-- ===== NEN VIDEOS ===== -->
  <div id="view-vids" class="view" style="display:none">
    <div class="ver">every nen video — click any to open its full script</div>
    <input id="vq" class="listsearch" placeholder="filter by name…" oninput="filterList('vgrid',this.value)">
    <div class="det" id="vdet"></div>
    <div id="vgrid" class="hgrid"></div>
  </div>

  <!-- ===== REFERENCES (non-Nen) ===== -->
  <div id="view-refs" class="view" style="display:none">
    <div class="ver">reference videos people shared — not made by nen. click ↗ to open the original</div>
    <input id="rq" class="listsearch" placeholder="filter by name…" oninput="filterList('rgrid',this.value)">
    <div class="det" id="rdet"></div>
    <div id="rgrid" class="hgrid"></div>
  </div>
</div>

<!-- lightbox -->
<div id="lb" class="lb" onclick="closeLb(event)">
  <div class="lbx" onclick="event.stopPropagation()">
    <img id="lbimg" src="">
    <div class="info">
      <div class="bn" id="lbbn"></div>
      <div class="ln" id="lbln"></div>
      <div class="tg" id="lbtg"></div>
      <div class="acts">
        <button class="lbtn" onclick="copyImg()">copy image</button>
        <a class="lbtn" id="lbdl" href="" download>download</a>
        <button class="lbtn" onclick="allFrames()">all frames in this video →</button>
        <a class="lbtn" id="lbscript" href="">open full script →</a>
        <span class="lbmsg" id="lbmsg"></span>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let VLOADED=false, RLOADED=false;
function tab(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  $('view-img').style.display = v==='img'?'block':'none';
  $('view-vids').style.display = v==='vids'?'block':'none';
  $('view-refs').style.display = v==='refs'?'block':'none';
  if(v==='vids' && !VLOADED){ VLOADED=true; loadVideos(); }
  if(v==='refs' && !RLOADED){ RLOADED=true; loadRefs(); }
}
function filterList(gridId, q){
  q=(q||'').toLowerCase().trim();
  document.querySelectorAll('#'+gridId+' .hcard').forEach(c=>{
    c.style.display=(!q || (c.dataset.name||'').includes(q))?'':'none';
  });
}

/* ---- nen videos list ---- */
async function loadVideos(){
  $('vdet').textContent='loading…';
  const d=await (await fetch('/api/videos')).json();
  $('vdet').textContent=`${d.count} videos`;
  $('vgrid').innerHTML=d.videos.map(v=>`<a class="hcard" data-name="${esc((v.brand+' '+v.broad+' '+(v.fine||'')).toLowerCase())}" href="/script?vid=${encodeURIComponent(v.vid)}">
    <img loading="lazy" src="/frame?vid=${encodeURIComponent(v.vid)}&sec=${v.hero_sec}&w=440">
    <div class="b"><div class="bn">${esc(v.brand)}</div>
    <div class="q">${esc(v.broad)}${v.fine?' — '+esc(v.fine):''}</div></div></a>`).join('');
}

/* ---- references (non-nen) list ---- */
async function loadRefs(){
  $('rdet').textContent='loading…';
  const d=await (await fetch('/api/references')).json();
  $('rdet').textContent=`${d.count} reference videos`;
  $('rgrid').innerHTML=d.references.map(r=>{
    const isInspo=r.kind==='inspo';
    const bdg='<span class="refbadge'+(isInspo?' inspo':'')+'">'+(isInspo?'INSPO':'REF')+'</span> ';
    const src=(r.source||'');
    const link=src.startsWith('http')?` · <a href="${esc(src)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ source</a>`:'';
    return `<div class="hcard" data-name="${esc(r.brand.toLowerCase())}" style="cursor:pointer" onclick="showFrames('${r.vid}')">
    <img loading="lazy" src="/img?id=${encodeURIComponent(r.hero)}&w=440">
    <div class="b"><div class="bn">${bdg}${esc(r.brand)}</div>
    <div class="q">${r.count} frames${link}</div></div></div>`;}).join('');
}

/* ---- image search ---- */
let IRES=[], CUR=null, IQ='', IOFF=0;
const masterURL=x=>'/img?id='+encodeURIComponent(x.id)+'&w=1100';
function badge(kind){
  if(!kind) return '';
  return '<span class="refbadge'+(kind==='inspo'?' inspo':'')+'">'+(kind==='inspo'?'INSPO':'REF')+'</span> ';
}
function cardHTML(x,i){
  const k=x.kind||(x.external?'ref':'');
  return `<div class="icard" onclick="openLb(${i})">
    <img loading="lazy" src="/img?id=${encodeURIComponent(x.id)}&w=440">
    <div class="m"><div class="mb">${badge(k)}${esc(x.brand)} · ${x.t}</div>
    <div class="ml">${esc(x.line||(x.tags||[]).join(', '))}</div></div></div>`;
}
function renderGrid(list, append){
  if(append){ const s=IRES.length; IRES=IRES.concat(list);
    $('igrid').insertAdjacentHTML('beforeend', list.map((x,j)=>cardHTML(x,s+j)).join('')); }
  else { IRES=list||[]; $('igrid').innerHTML=IRES.map((x,i)=>cardHTML(x,i)).join(''); }
}
async function isearch(more){
  const q=$('iq').value.trim();
  if(!q){$('igrid').innerHTML='';$('imore').innerHTML='';$('idet').textContent='type what you’re looking for.';return;}
  if(!more){ IQ=q; IOFF=0; IRES=[]; $('igrid').innerHTML=''; $('imore').innerHTML=''; $('idet').textContent='searching…'; }
  else { $('imore').innerHTML='<div class="moredone">loading…</div>'; }
  const r=await fetch('/api/image_search?q='+encodeURIComponent(IQ)+'&k=50&offset='+IOFF);
  const d=await r.json();
  const res=d.results||[];
  if(!more && !res.length){ renderGrid([]); $('idet').textContent=`no matches in ${d.count} frames — try simpler words or a script line.`; $('imore').innerHTML=''; return; }
  renderGrid(res, !!more); IOFF+=res.length;
  $('idet').textContent=`${IRES.length} of ${d.count} frames`;
  $('imore').innerHTML = d.has_more
    ? '<button class="morebtn" onclick="isearch(1)">generate 50 more ↓</button>'
    : (IRES.length ? '<div class="moredone">— end of results —</div>' : '');
}
function openLb(i){
  const x=IRES[i]; if(!x)return; CUR=x;
  $('lbimg').src=masterURL(x);
  $('lbbn').textContent=[x.brand,x.arch,x.t].filter(Boolean).join(' · ');
  $('lbln').textContent=x.line||'';
  $('lbtg').textContent=(x.tags||[]).join('  ·  ');
  const dl=$('lbdl'); dl.href=masterURL(x); dl.setAttribute('download',x.id+'.jpg');
  const sc=$('lbscript');
  if((x.external||x.kind) && x.source){ sc.textContent='↗ original source'; sc.href=x.source; sc.target='_blank'; sc.style.display=''; }
  else if(x.external||x.kind){ sc.style.display='none'; }
  else { sc.textContent='open full script →'; sc.href='/script?vid='+encodeURIComponent(x.vid); sc.removeAttribute('target'); sc.style.display=''; }
  $('lbmsg').textContent='';
  $('lb').classList.add('on');
}
function closeLb(e){$('lb').classList.remove('on');}
function flash(m){$('lbmsg').textContent=m; setTimeout(()=>{if($('lbmsg').textContent===m)$('lbmsg').textContent='';},1800);}
async function copyImg(){
  if(!CUR)return; flash('copying…');
  try{
    const blob=await (await fetch(masterURL(CUR))).blob();
    const bmp=await createImageBitmap(blob);
    const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0);
    const png=await new Promise(res=>c.toBlob(res,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);
    flash('✓ image copied');
  }catch(e){
    try{await navigator.clipboard.writeText(location.origin+masterURL(CUR)); flash('✓ image link copied');}
    catch(_){flash('copy failed — use download');}
  }
}
async function showFrames(vid){
  tab('img');
  $('idet').textContent='loading frames…'; $('igrid').innerHTML=''; $('imore').innerHTML='';
  const d=await (await fetch('/api/video_frames?vid='+encodeURIComponent(vid))).json();
  $('idet').innerHTML=`all ${d.count} frames from <b>${esc(d.brand)}</b> · <a href="#" onclick="$('iq').focus();return false;" style="color:#6f6f6f">new search ↑</a>`;
  renderGrid(d.results); window.scrollTo(0,0);
}
async function allFrames(){
  if(!CUR)return; const vid=CUR.vid; closeLb(); showFrames(vid);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
$('iq').addEventListener('keydown',e=>{if(e.key==='Enter')isearch();});
</script>
</body></html>
