name: keep-warm

# Render's free tier sleeps after ~15 min idle, and waking it takes 30-60s (the slow
# "initial loading"). We keep it warm with GitHub Actions (free/unlimited for this public
# repo). GitHub's scheduled runs are best-effort and often delayed or skipped, so a single
# ping every 10 min leaves gaps that let the app sleep. Instead: schedule every 10 min AND
# have EACH run ping repeatedly over ~16 min. Overlapping runs then give near-continuous
# coverage, so even when GitHub drops or delays a trigger, the idle gap stays under 15 min.
#
# NOTE: this reduces cold starts but is still best-effort (it depends on GitHub firing the
# schedule). For a hard guarantee that it is ALWAYS instant, upgrade the Render service to
# the Starter plan (always-on, no sleep) in the Render dashboard, or set plan: starter in
# render.yaml. That is the only way to eliminate cold starts entirely.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub best-effort; may drift/skip)
  workflow_dispatch: {}       # allow manual "Run workflow" too

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Keep the app + search model warm (repeat over ~16 min)
        run: |
          URL="https://nen-reference-finder.onrender.com"
          for i in 1 2 3 4 5; do
            curl -s -m 90 "$URL/api/image_search?q=warm&k=1" -o /dev/null -w "search $i: HTTP %{http_code} in %{time_total}s\n" || true
            curl -s -m 90 "$URL/" -o /dev/null -w "home   $i: HTTP %{http_code} in %{time_total}s\n" || true
            if [ "$i" -lt 5 ]; then sleep 240; fi
          done
